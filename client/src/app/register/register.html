<main class="page">
  <div class="card">
    <img class="brand" src="/fabulari-logo.png" alt="Fabulari">
    <h1>Create Account</h1>

    <!-- runs onSubmit() on submit -->
    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <!-- [(ngModel)] keeps the input and the email property in sync -->
        <input id="email" name="email" type="email" [(ngModel)]="email" required />
      </div>

      <div class="field">
        <label for="username">Display name <span class="optional">optional</span></label>
        <!-- blank defaults to the part of the email before the @ -->
        <input id="username" name="username" type="text" maxlength="50" [(ngModel)]="username" />
      </div>

      <div class="field">
        <label for="dob">Date of birth <span class="optional">optional</span></label>
        <!-- needed to join an age limited group, can be added later on the profile page -->
        <input id="dob" name="dob" type="date" [(ngModel)]="dob" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required minlength="6" />
        <!-- the server checks this too -->
        <span class="hint">At least 6 characters.</span>
      </div>

      <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Registering…' : 'Register' }}</button>
    </form>

    @if (errormessage()) {
      <p class="error" role="alert" animate.enter="fade-in">{{ errormessage() }}</p>
    }

    @if (successmessage()) {
      <p class="success" role="status" animate.enter="fade-in">{{ successmessage() }}</p>
    }

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</main>
