<main class="page">
  <div class="card">
    <img class="brand" src="/fabulari-logo.png" alt="Fabulari">
    <h1>Welcome Back!</h1>
    

    <!-- runs onSubmit() on submit -->
  <form (ngSubmit)="onSubmit()">
    <div class="field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required />
  </div>

  <!-- disabled during a login so a double click can't send two -->
  <button type="submit" [disabled]="submitting()">{{ submitting() ? 'Logging in…' : 'Log In' }}</button>
</form>


    <!-- role="alert" is read out straight away by screen readers, role="status" at the next pause -->
    @if (errormessage()) {
  <p class="error" role="alert">{{ errormessage() }}</p>
}

@if (successmessage()) {
  <p class="success" role="status">{{ successmessage() }}</p>
}


    <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</main>
