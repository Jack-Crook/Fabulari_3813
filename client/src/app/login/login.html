<div class="page">
  <div class="card">
    <img class="brand" src="/fabulari-logo.png" alt="Fabulari">
    <h2>Welcome Back!</h2>
    

    <!-- runs onSubmit() when the form is submitted -->
  <form (ngSubmit)="onSubmit()">
    <div class="field">
    <label for="email">Email</label>
    <!-- keeps this box in sync with the email variable -->
    <input id="email" name="email" type="email" [(ngModel)]="email" required />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required />
  </div>

  <!-- just text from the wireframe, doesn't do anything yet -->
  <a class="forgot" href="#">Forgot your password?</a>

  <button type="submit">Log In</button>
</form>


    <!-- shows this only if there's an error message -->
    @if (errormessage()) {
  <p class="error">{{ errormessage() }}</p>
}

@if (successmessage()) {
  <p class="success">{{ successmessage() }}</p>
}


    <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
