<app-navbar></app-navbar>

<div class="chat-body">

  <!-- left, the other rooms in this group so you can switch without going back -->
  <aside class="rooms-sidebar">
    <h2>Rooms</h2>

    <!-- signals are read by calling them, so channels() and channel() -->
    @for (item of channels(); track item.id) {
      <a class="room-link"
         [class.selected]="item.id === channel()?.id"
         [routerLink]="['/groups', group()?.id, 'channels', item.id]">
        {{ item.name }}
      </a>
    }

    <!-- back out to the group's room list -->
    <a class="back-link" [routerLink]="['/groups', group()?.id]">Back to group</a>
  </aside>

  <!-- middle, the conversation itself -->
  <section class="chat-main">
    <div class="messages">
      @for (message of messages; track $index) {
        <!-- my own messages sit on the right, everyone else's on the left -->
        <div class="message" [class.mine]="message.sender === me">
          <p class="message-sender">
            {{ message.sender }}
            @if (isAdmin(message.sender)) {
              <span class="admin-tag">Admin</span>
            }
          </p>
          <p class="message-body">{{ message.body }}</p>
        </div>
      }
    </div>

    <!-- the input bar. it doesn't send anything yet, sending needs socket.io in phase 2 -->
    <div class="composer">
      <input type="text" placeholder="Message {{ channel()?.name }}" />
    </div>
  </section>

  <!-- right, who else is in the room -->
  <aside class="presence-sidebar">
    <h2>Currently In</h2>

    @for (person of currentlyIn; track person) {
      <p class="person">{{ person }}</p>
    }
  </aside>

</div>
