<header class="navbar">
  <!-- the logo doubles as a way back to the dashboard, same as most sites -->
  <a class="nav-logo-link" routerLink="/user-dashboard">
    <img src="/fabulari-logo.png" alt="Fabulari logo" class="nav-logo">
  </a>
    <ul class="nav-links">
    <li><a routerLink="/user-dashboard" routerLinkActive="active">Dashboard</a></li>
    <!-- only shown when the group being viewed is one this user admins -->
    @if (isGroupAdmin()) {
      <li><a [routerLink]="['/admin-dashboard', currentGroupId()]" routerLinkActive="active">Group Admin</a></li>
    }
    <!-- a plain boolean, not a signal, so it isn't called like isGroupAdmin() above -->
    @if (isSuperAdmin) {
      <li><a routerLink="/super-admin-dashboard" routerLinkActive="active">Super Admin</a></li>
    }
    <li><a routerLink="/profile" routerLinkActive="active">Profile</a></li>
    <!-- every page in this app looks different depending on who you are, so the bar says which
         account is signed in rather than leaving it to be worked out from the page -->
    <li class="nav-who">{{ displayName }}</li>
    <li><button type="button" (click)="onLogout()">Logout</button></li>
  </ul>
</header>
